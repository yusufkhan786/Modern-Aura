<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Aura</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">      fit the code in it 
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Poppins', sans-serif; background: #0a0a0a; color: white; }
    header {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #000000, #1a1a1a);
      text-align: center;
    }
    header h1 { font-size: 3rem; letter-spacing: 2px; }
    header p { margin-top: 10px; font-size: 1.2rem; color: #aaa; }
    header button {
      margin-top: 20px;
      padding: 12px 30px;
      border: none;
      background: white;
      color: black;
      font-weight: bold;
      cursor: pointer;
      border-radius: 30px;
      transition: 0.3s;
    }
    header button:hover { background: #ddd; }

    .products {
      padding: 50px 20px;
      text-align: center;
    }
    .products h2 { margin-bottom: 30px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .card {
      background: #111;
      padding: 15px;
      border-radius: 10px;
      transition: 0.3s;
    }
    .card:hover { transform: translateY(-5px); }
    .card img { width: 100%; border-radius: 10px; }
    .card h3 { margin: 10px 0; }
    .card p { color: #aaa; }
    .card button {
      margin-top: 10px;
      padding: 10px 20px;
      border: none;
      background: white;
      color: black;
      border-radius: 20px;
      cursor: pointer;
    }

    footer {
      padding: 20px;
      text-align: center;
      background: #000;
      color: #777;
    }
  </style>
</head>
<body>

<header>
  <h1>Modern Aura</h1>
  <p>Wear Your Aura</p>
  <button onclick="scrollToProducts()">Shop Now</button>
</header>

<section class="products" id="products">
  <h2>Our Collection</h2>
  <div class="grid">

    <div class="card">
      <img src="Front_1_c_18.jpg" alt="T-shirt">
      <h3>Dark Aura Unisex Acidwashed Tee</h3>
      <p>₹449</p>
      <button onclick="buyNow('Dark Aura Tee')">Buy Now</button>
    </div>

    <div class="card">
      <img src="Front_1_c_2.jpg" alt="T-shirt">
      <h3>Plain Dark Oversized Tee</h3>
      <p>₹399</p>
      <button onclick="buyNow('Minimal Soul Tee')">Buy Now</button>
    </div>

    <div class="card">
      <img src="Front_1_c_4.jpg"" alt="T-shirt">
      <h3>Fahh Unisex Oversized Tee</h3>
      <p>₹399</p>
      <button onclick="buyNow('Chaos Mind Tee')">Buy Now</button>

      <div class="card">
      <img src="Front_1_c_3.jpg" alt="T-shirt">
      <h3>67 Dark Oversized Tee</h3>
      <p>₹449</p>
      <button onclick="buyNow('Minimal Soul Tee')">Buy Now</button>
    </div>
  

  </div>
</section>

<footer>
  <p>© 2026 Modern Aura. All rights reserved.</p>
</footer>

<script>

function scrollToProducts() {
  document.getElementById('products').scrollIntoView({ behavior: 'smooth' });
}

function buyNow(product) {
  alert('DM us on Instagram to order: ' + product);
}
function buyNow(product) {
  const username = "wearmodernaura"; // replace with your IG username
  const message = encodeURIComponent(`Hi, I want to order: ${product}`);
  window.open(`https://www.instagram.com/wearmodernaura/?text=${I want to buy your product}`, "_blank");
}
</script>

<!-- Vercel Web Analytics -->
<script type="module" src="./analytics.js"></script>

</body>
</html>
