<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modern Aura</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Poppins', sans-serif; background: #0a0a0a; color: white; }

header {
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #000, #1a1a1a);
  text-align: center;
}
header h1 { font-size: 3rem; }
header p { color: #aaa; margin-top: 10px; }
header button {
  margin-top: 20px;
  padding: 12px 30px;
  border: none;
  background: white;
  color: black;
  border-radius: 30px;
  cursor: pointer;
}

.products { padding: 50px 20px; text-align: center; }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
}

.card {
  background: #111;
  padding: 15px;
  border-radius: 10px;
}

.slider { position: relative; }
.slider img {
  width: 100%;
  display: none;
  border-radius: 10px;
}
.slider img.active { display: block; }

.buttons {
  position: absolute;
  top: 50%;
  width: 100%;
  display: flex;
  justify-content: space-between;
  transform: translateY(-50%);
}
.buttons button {
  background: rgba(0,0,0,0.6);
  color: white;
  border: none;
  padding: 5px 10px;
  cursor: pointer;
}

.card h3 { margin: 10px 0; }
.card p { color: #aaa; }

.buy-btn {
  margin-top: 10px;
  padding: 10px 20px;
  border: none;
  background: white;
  color: black;
  border-radius: 20px;
  cursor: pointer;
  width: 100%;
}

.upi-btn {
  margin-top: 8px;
  padding: 10px;
  background: #00ffcc;
  border: none;
  border-radius: 20px;
  cursor: pointer;
  width: 100%;
  color: black;
  font-weight: bold;
}

.note {
  font-size: 12px;
  color: #888;
  margin-top: 5px;
}

footer {
  padding: 20px;
  text-align: center;
  background: #000;
  color: #777;
}
</style>
</head>

<body>

<header>
  <h1>Modern Aura</h1>
  <p>Wear Your Aura</p>
  <button onclick="scrollToProducts()">Shop Now</button>
</header>

<section class="products" id="products">
  <h2>Our Collection</h2>

  <div class="grid">

    <!-- PRODUCT 1 -->
    <div class="card">
      <div class="slider">
        <img src="Front_1_c_18.jpg" class="active">
        <img src="back1.jpg">
        <img src="model1.jpg">
        <div class="buttons">
          <button onclick="prevSlide(this)">◀</button>
          <button onclick="nextSlide(this)">▶</button>
        </div>
      </div>

      <h3>Dark Aura Acidwashed Tee</h3>
      <p>₹449</p>

      <button class="buy-btn" onclick="openInstagram('Dark Aura Tee')">Buy via Instagram</button>
      <button class="upi-btn" onclick="payUPI('Dark Aura Tee',449)">Pay via UPI</button>

      <div class="note">DM @wearmodernaura to order</div>
    </div>

    <!-- PRODUCT 2 -->
    <div class="card">
      <div class="slider">
        <img src="Front_1_c_2.jpg" class="active">
        <img src="back2.jpg">
        <img src="model2.jpg">
        <div class="buttons">
          <button onclick="prevSlide(this)">◀</button>
          <button onclick="nextSlide(this)">▶</button>
        </div>
      </div>

      <h3>Plain Dark Oversized Tee</h3>
      <p>₹399</p>

      <button class="buy-btn" onclick="openInstagram('Plain Dark Tee')">Buy via Instagram</button>
      <button class="upi-btn" onclick="payUPI('Plain Dark Tee',399)">Pay via UPI</button>

      <div class="note">DM @wearmodernaura to order</div>
    </div>

    <!-- PRODUCT 3 -->
    <div class="card">
      <div class="slider">
        <img src="Front_1_c_4.jpg" class="active">
        <img src="back3.jpg">
        <img src="model3.jpg">
        <div class="buttons">
          <button onclick="prevSlide(this)">◀</button>
          <button onclick="nextSlide(this)">▶</button>
        </div>
      </div>

      <h3>Fahh Oversized Tee</h3>
      <p>₹399</p>

      <button class="buy-btn" onclick="openInstagram('Fahh Tee')">Buy via Instagram</button>
      <button class="upi-btn" onclick="payUPI('Fahh Tee',399)">Pay via UPI</button>

      <div class="note">DM @wearmodernaura to order</div>
    </div>

  </div>
</section>

<footer>
  <p>© 2026 Modern Aura</p>
</footer>

<script>
function scrollToProducts() {
  document.getElementById('products').scrollIntoView({ behavior: 'smooth' });
}

function nextSlide(btn) {
  let slider = btn.closest('.slider');
  let imgs = slider.querySelectorAll('img');
  let index = [...imgs].findIndex(img => img.classList.contains('active'));
  imgs[index].classList.remove('active');
  imgs[(index + 1) % imgs.length].classList.add('active');
}

function prevSlide(btn) {
  let slider = btn.closest('.slider');
  let imgs = slider.querySelectorAll('img');
  let index = [...imgs].findIndex(img => img.classList.contains('active'));
  imgs[index].classList.remove('active');
  imgs[(index - 1 + imgs.length) % imgs.length].classList.add('active');
}

function openInstagram(product) {
  const username = "wearmodernaura";
  window.open(`https://www.instagram.com/${username}/`, "_blank");
}

function payUPI(product, price) {
  const upiID = "yourupi@upi"; // 🔥 replace this
  const name = "Modern Aura";
  const url = `upi://pay?pa=${upiID}&pn=${name}&am=${price}&cu=INR&tn=${product}`;
  window.location.href = url;
}
</script>

</body>
</html>
